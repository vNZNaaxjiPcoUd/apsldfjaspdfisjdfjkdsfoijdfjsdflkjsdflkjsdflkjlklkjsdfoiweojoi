<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>網址編碼還原器（URL Decoder）</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/60 text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900">

  <!-- 頂部通知氣泡 (取代 alert) -->
  <div id="toast" role="status" aria-live="polite"
    class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 -translate-y-3 transition-all duration-300 ease-out">
    <div id="toastContent" class="flex items-center gap-2 px-4 py-2.5 rounded-full shadow-lg bg-slate-900 text-white text-sm font-medium">
      <span id="toastIcon"></span>
      <span id="toastText"></span>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    
    <!-- 頁首標題區 -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600 text-white shadow-md shadow-indigo-200 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
        </svg>
      </div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">
        網址編碼還原器
      </h1>
      <p class="mt-2 text-sm sm:text-base text-slate-500 max-w-xl mx-auto">
        將包含百分比編碼（UTF-8）的亂碼網址即時轉換為清晰可讀的中文連結，支援保留空白編碼以防止通訊軟體斷行。
      </p>
    </header>

    <!-- 主卡片 -->
    <main class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-xl shadow-slate-200/70 border border-slate-200/80 overflow-hidden">
      
      <!-- 區塊一：輸入區 -->
      <section class="p-5 sm:p-7 border-b border-slate-100">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <label for="inputUrl" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
            <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
            原始編碼網址
          </label>
          <div class="flex items-center gap-2">
            <button type="button" id="sampleBtn"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 bg-slate-100 hover:bg-slate-200/80 active:scale-95 transition">
              填入範例
            </button>
            <button type="button" id="pasteBtn"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-indigo-700 bg-indigo-50 hover:bg-indigo-100 active:scale-95 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
              </svg>
              貼上
            </button>
            <button type="button" id="clearBtn"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 active:scale-95 transition">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              清空
            </button>
          </div>
        </div>

        <div class="relative">
          <textarea id="inputUrl" rows="3" spellcheck="false"
            placeholder="請在此貼上或輸入包含 %E5%8F%B0... 的編碼網址"
            class="w-full rounded-2xl border border-slate-200 bg-slate-50/70 px-4 py-3.5 text-sm sm:text-base font-mono text-slate-800 placeholder:text-slate-400 focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition resize-y">https://d.jwint.net/2026%20%E5%B9%B4%E5%8F%B0%E7%81%A3%E7%B1%B3%E5%85%B6%E6%9E%97%E5%BF%85%E6%AF%94%E7%99%BB%E6%8E%A8%E4%BB%8B</textarea>
        </div>

        <!-- 友善提示訊息（例如剪貼簿限制或編碼不完整） -->
        <div id="warningBanner" class="hidden mt-3 flex items-start gap-2.5 rounded-xl bg-amber-50 border border-amber-200/80 px-3.5 py-2.5 text-xs sm:text-sm text-amber-800">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-amber-500 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
          <span id="warningText"></span>
        </div>
      </section>

      <!-- 區塊二：轉換模式切換 -->
      <section class="px-5 sm:px-7 py-4 bg-slate-50/80 border-b border-slate-100">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">轉換模式選擇</span>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full sm:w-auto" role="radiogroup" aria-label="解碼模式">
            <!-- 模式一（預設） -->
            <button type="button" id="modeKeepSpace" role="radio" aria-checked="true"
              class="mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm">
              <span class="w-2 h-2 rounded-full bg-white"></span>
              <span>可讀連線網址（保留 %20）</span>
            </button>

            <!-- 模式二 -->
            <button type="button" id="modeFullDecode" role="radio" aria-checked="false"
              class="mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50">
              <span class="w-2 h-2 rounded-full bg-slate-300"></span>
              <span>完全解碼（含空白）</span>
            </button>
          </div>
        </div>
        <p id="modeDescription" class="mt-2.5 text-xs text-slate-500 leading-relaxed">
          目前模式：將 UTF-8 編碼還原為中文字，並保留 <code class="px-1.5 py-0.5 rounded bg-slate-200/70 text-slate-700 font-mono">%20</code>，確保貼到 LINE、Messenger 或文件中不會因空白而截斷超連結。
        </p>
      </section>

      <!-- 區塊三：輸出與操作區 -->
      <section class="p-5 sm:p-7">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <label for="outputUrl" class="flex items-center gap-2 text-sm font-semibold text-slate-700">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            轉換結果
          </label>
          <span id="charCount" class="text-xs text-slate-400">0 個字元</span>
        </div>

        <div class="relative">
          <textarea id="outputUrl" rows="3" readonly
            placeholder="轉換後的網址將會即時顯示於此..."
            class="w-full rounded-2xl border border-slate-200 bg-emerald-50/30 px-4 py-3.5 text-sm sm:text-base text-slate-900 font-medium focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 outline-none transition resize-y"></textarea>
        </div>

        <!-- 主要操作按鈕列 -->
        <div class="mt-4 flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
          <button type="button" id="copyBtn"
            class="flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] shadow-md shadow-indigo-200 transition">
            <svg id="copyIconDefault" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
            </svg>
            <svg id="copyIconSuccess" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <span id="copyBtnText">一鍵複製結果</span>
          </button>

          <a id="openLinkBtn" href="#" target="_blank" rel="noopener noreferrer"
            class="hidden sm:inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl text-sm font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200/80 active:scale-[0.99] transition">
            <span>直接開啟連結</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>

        <!-- 有效網址超連結預覽卡片 -->
        <div id="linkPreviewBox" class="hidden mt-5 rounded-2xl border border-indigo-100 bg-indigo-50/50 p-4 transition-all">
          <div class="flex items-center justify-between gap-2 mb-1.5">
            <span class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-700">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
              </svg>
              可點擊超連結預覽
            </span>
            <span class="text-[11px] text-indigo-500">點擊可於新分頁開啟測試</span>
          </div>
          <a id="previewAnchor" href="#" target="_blank" rel="noopener noreferrer"
            class="block text-sm text-indigo-600 hover:text-indigo-800 underline decoration-indigo-300 hover:decoration-indigo-600 underline-offset-4 break-all font-medium transition">
          </a>
        </div>
      </section>
    </main>

    <!-- 頁尾說明 -->
    <footer class="mt-6 text-center text-xs text-slate-400">
      所有解碼運算皆於您的瀏覽器本機端即時完成，不會上傳任何網址資料。
    </footer>
  </div>

  <script>
    (function () {
      // 預設範例網址
      const SAMPLE_URL = 'https://d.jwint.net/2026%20%E5%B9%B4%E5%8F%B0%E7%81%A3%E7%B1%B3%E5%85%B6%E6%9E%97%E5%BF%85%E6%AF%94%E7%99%BB%E6%8E%A8%E4%BB%8B';

      // DOM 元素參照
      const inputEl = document.getElementById('inputUrl');
      const outputEl = document.getElementById('outputUrl');
      const sampleBtn = document.getElementById('sampleBtn');
      const pasteBtn = document.getElementById('pasteBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyBtn = document.getElementById('copyBtn');
      const copyBtnText = document.getElementById('copyBtnText');
      const copyIconDefault = document.getElementById('copyIconDefault');
      const copyIconSuccess = document.getElementById('copyIconSuccess');
      const modeKeepSpaceBtn = document.getElementById('modeKeepSpace');
      const modeFullDecodeBtn = document.getElementById('modeFullDecode');
      const modeDescription = document.getElementById('modeDescription');
      const warningBanner = document.getElementById('warningBanner');
      const warningText = document.getElementById('warningText');
      const charCount = document.getElementById('charCount');
      const openLinkBtn = document.getElementById('openLinkBtn');
      const linkPreviewBox = document.getElementById('linkPreviewBox');
      const previewAnchor = document.getElementById('previewAnchor');
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toastText');
      const toastIcon = document.getElementById('toastIcon');

      // 狀態變數：預設為模式一（保留 %20）
      let currentMode = 'keepSpace'; // 'keepSpace' | 'full'
      let toastTimer = null;
      let copyResetTimer = null;

      /**
       * 顯示頂部輕量通知氣泡
       */
      function showToast(message, type = 'success') {
        clearTimeout(toastTimer);
        toastText.textContent = message;
        toastIcon.textContent = type === 'success' ? '✓' : '!';
        toast.classList.remove('opacity-0', '-translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');

        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', '-translate-y-3');
        }, 2200);
      }

      /**
       * 安全解碼片段：將連續的 %XX 區塊嘗試進行 UTF-8 decodeURIComponent，
       * 若遇到不完整的百分比編碼（例如截斷的 %E5），保留原樣並標記警告，避免程式拋出例外崩潰。
       */
      function safeDecodeChunk(text) {
        let hasMalformed = false;

        // 偵測孤立或不完整的 % 符號（例如 %E 或結尾單獨的 %）
        if (/%(?![0-9A-Fa-f]{2})/.test(text)) {
          hasMalformed = true;
        }

        // 針對連續的 %XX 序列逐段解碼
        const decoded = text.replace(/((?:%[0-9A-Fa-f]{2})+)/g, (match) => {
          try {
            return decodeURIComponent(match);
          } catch (e) {
            // 若整段連續 %XX 無法一次解碼（例如中間夾雜不完整 UTF-8 位元組），
            // 嘗試退回逐個有效 UTF-8 序列解碼，其餘保留原字元
            hasMalformed = true;
            return match.replace(
              /(?:%[0-7][0-9A-Fa-f]|%[CcDd][0-9A-Fa-f]%[89ABab][0-9A-Fa-f]|%[Ee][0-9A-Fa-f](?:%[89ABab][0-9A-Fa-f]){2}|%[Ff][0-7](?:%[89ABab][0-9A-Fa-f]){3})/g,
              (validUtf8) => {
                try {
                  return decodeURIComponent(validUtf8);
                } catch (_) {
                  return validUtf8;
                }
              }
            );
          }
        });

        return { decoded, hasMalformed };
      }

      /**
       * 依據目前選擇的模式進行網址解碼
       */
      function decodeUrlString(rawInput, mode) {
        if (!rawInput) {
          return { result: '', hasMalformed: false };
        }

        if (mode === 'full') {
          const { decoded, hasMalformed } = safeDecodeChunk(rawInput);
          return { result: decoded, hasMalformed };
        }

        // 模式一：保留 %20（不區分大小寫如 %20），其餘百分比編碼還原為可讀文字
        const segments = rawInput.split(/(%20)/gi);
        let anyMalformed = false;

        const processed = segments.map((seg) => {
          if (/^%20$/i.test(seg)) {
            return '%20';
          }
          const { decoded, hasMalformed } = safeDecodeChunk(seg);
          if (hasMalformed) {
            anyMalformed = true;
          }
          return decoded;
        });

        return { result: processed.join(''), hasMalformed: anyMalformed };
      }

      /**
       * 檢查字串是否為單一有效的 http:// 或 https:// 網址
       */
      function extractValidHttpUrl(str) {
        const trimmed = str.trim();
        if (!trimmed || /\s/.test(trimmed)) {
          // 若包含實際空白字元（例如模式二將 %20 轉為空白），將空白轉回 %20 供 href 使用
          const firstLine = trimmed.split(/\r?\n/)[0].trim();
          if (/^https?:\/\/\S+/i.test(firstLine)) {
            try {
              const normalized = firstLine.replace(/ /g, '%20');
              const urlObj = new URL(normalized);
              if (urlObj.protocol === 'http:' || urlObj.protocol === 'https:') {
                return normalized;
              }
            } catch (_) {
              return null;
            }
          }
          return null;
        }

        if (/^https?:\/\//i.test(trimmed)) {
          try {
            const urlObj = new URL(trimmed);
            if (urlObj.protocol === 'http:' || urlObj.protocol === 'https:') {
              return trimmed;
            }
          } catch (_) {
            return null;
          }
        }
        return null;
      }

      /**
       * 執行轉換並更新畫面狀態
       */
      function processConversion() {
        const raw = inputEl.value;
        const { result, hasMalformed } = decodeUrlString(raw, currentMode);

        outputEl.value = result;
        charCount.textContent = `${result.length} 個字元`;

        // 處理不完整編碼的友善警告
        if (hasMalformed && raw.trim() !== '') {
          warningText.textContent = '偵測到部分不完整或無效的百分比編碼（如截斷的 %E5），已自動保留異常字元並完成其餘部分解碼。';
          warningBanner.classList.remove('hidden');
        } else {
          warningBanner.classList.add('hidden');
        }

        // 處理超連結預覽與「直接開啟連結」按鈕
        const validHref = extractValidHttpUrl(result);
        if (validHref) {
          openLinkBtn.href = validHref;
          openLinkBtn.classList.remove('hidden');
          openLinkBtn.classList.add('inline-flex');

          previewAnchor.href = validHref;
          previewAnchor.textContent = result.trim();
          linkPreviewBox.classList.remove('hidden');
        } else {
          openLinkBtn.classList.add('hidden');
          openLinkBtn.classList.remove('inline-flex');
          linkPreviewBox.classList.add('hidden');
        }
      }

      /**
       * 切換解碼模式 UI 與邏輯
       */
      function setMode(mode) {
        currentMode = mode;

        if (mode === 'keepSpace') {
          modeKeepSpaceBtn.setAttribute('aria-checked', 'true');
          modeKeepSpaceBtn.className = 'mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm';
          modeKeepSpaceBtn.querySelector('span:first-child').className = 'w-2 h-2 rounded-full bg-white';

          modeFullDecodeBtn.setAttribute('aria-checked', 'false');
          modeFullDecodeBtn.className = 'mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
          modeFullDecodeBtn.querySelector('span:first-child').className = 'w-2 h-2 rounded-full bg-slate-300';

          modeDescription.innerHTML = '目前模式：將 UTF-8 編碼還原為中文字，並保留 <code class="px-1.5 py-0.5 rounded bg-slate-200/70 text-slate-700 font-mono">%20</code>，確保貼到 LINE、Messenger 或文件中不會因空白而截斷超連結。';
        } else {
          modeFullDecodeBtn.setAttribute('aria-checked', 'true');
          modeFullDecodeBtn.className = 'mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-indigo-600 text-white border-indigo-600 shadow-sm';
          modeFullDecodeBtn.querySelector('span:first-child').className = 'w-2 h-2 rounded-full bg-white';

          modeKeepSpaceBtn.setAttribute('aria-checked', 'false');
          modeKeepSpaceBtn.className = 'mode-btn flex items-center justify-center sm:justify-start gap-2 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium border transition-all bg-white text-slate-600 border-slate-200 hover:bg-slate-50';
          modeKeepSpaceBtn.querySelector('span:first-child').className = 'w-2 h-2 rounded-full bg-slate-300';

          modeDescription.innerHTML = '目前模式：完全解碼所有百分比編碼（包含將 <code class="px-1.5 py-0.5 rounded bg-slate-200/70 text-slate-700 font-mono">%20</code> 還原為一般空白鍵），適合用於純文字閱讀與內容檢視。';
        }

        processConversion();
      }

      /**
       * 複製結果文字至剪貼簿（使用相容性最高的 execCommand('copy')）
       */
      function copyResult() {
        const textToCopy = outputEl.value;
        if (!textToCopy) {
          showToast('目前沒有可複製的內容', 'warn');
          return;
        }

        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = textToCopy;
        tempTextarea.style.position = 'fixed';
        tempTextarea.style.left = '-9999px';
        tempTextarea.style.top = '0';
        document.body.appendChild(tempTextarea);
        tempTextarea.focus();
        tempTextarea.select();

        let copied = false;
        try {
          copied = document.execCommand('copy');
        } catch (err) {
          copied = false;
        }
        document.body.removeChild(tempTextarea);

        if (copied) {
          // 更新按鈕狀態為「已複製！」
          clearTimeout(copyResetTimer);
          copyBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-200');
          copyBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-200');
          copyIconDefault.classList.add('hidden');
          copyIconSuccess.classList.remove('hidden');
          copyBtnText.textContent = '已複製！';
          showToast('已複製到剪貼簿！');

          copyResetTimer = setTimeout(() => {
            copyBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700', 'shadow-emerald-200');
            copyBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-200');
            copyIconSuccess.classList.add('hidden');
            copyIconDefault.classList.remove('hidden');
            copyBtnText.textContent = '一鍵複製結果';
          }, 2000);
        } else {
          // 若複製受限，自動選取輸出框文字方便手動複製
          outputEl.focus();
          outputEl.select();
          showToast('已選取文字，請按 Ctrl+C / Cmd+C 複製', 'warn');
        }
      }

      /**
       * 貼上剪貼簿內容
       */
      async function pasteFromClipboard() {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const clipText = await navigator.clipboard.readText();
            if (clipText) {
              inputEl.value = clipText;
              processConversion();
              showToast('已貼上剪貼簿內容');
              return;
            }
          }
          throw new Error('Clipboard read unavailable');
        } catch (err) {
          // 若因權限或 iframe 環境無法直接讀取剪貼簿，聚焦輸入框並給予友善引導
          inputEl.focus();
          inputEl.select();
          showToast('請直接在輸入框按 Ctrl+V / Cmd+V 貼上', 'warn');
        }
      }

      // 綁定事件監聽器
      inputEl.addEventListener('input', processConversion);

      modeKeepSpaceBtn.addEventListener('click', () => setMode('keepSpace'));
      modeFullDecodeBtn.addEventListener('click', () => setMode('full'));

      sampleBtn.addEventListener('click', () => {
        inputEl.value = SAMPLE_URL;
        processConversion();
        showToast('已填入範例網址');
      });

      pasteBtn.addEventListener('click', pasteFromClipboard);

      clearBtn.addEventListener('click', () => {
        inputEl.value = '';
        inputEl.focus();
        processConversion();
        showToast('已清空內容');
      });

      copyBtn.addEventListener('click', copyResult);

      // 頁面載入後立即執行一次預設範例轉換
      processConversion();
    })();
  </script>
</body>
</html>
