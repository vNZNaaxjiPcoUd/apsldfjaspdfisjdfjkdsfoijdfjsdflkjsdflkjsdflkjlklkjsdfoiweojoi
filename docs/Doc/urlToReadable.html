  <script>
    (function () {
      // 預設雙向範例網址
      const ENCODED_SAMPLE_URL = 'https://d.jwint.net/2026%20%E5%B9%B4%E5%8F%B0%E7%81%A3%E7%B1%B3%E5%85%B6%E6%9E%97%E5%BF%85%E6%AF%94%E7%99%BB%E6%8E%A8%E4%BB%8B';
      const READABLE_SAMPLE_URL = 'https://d.jwint.net/2026%20年台灣米其林必比登推介';

      // DOM 元素參照
      const dirDecodeBtn = document.getElementById('dirDecodeBtn');
      const dirEncodeBtn = document.getElementById('dirEncodeBtn');
      const inputEl = document.getElementById('inputUrl');
      const inputLabelText = document.getElementById('inputLabelText');
      const inputCharCount = document.getElementById('inputCharCount');
      const outputEl = document.getElementById('outputUrl');
      const outputLabelText = document.getElementById('outputLabelText');
      const outputCharCount = document.getElementById('outputCharCount');
      const subModeTitle = document.getElementById('subModeTitle');
      const optionABtn = document.getElementById('optionABtn');
      const optionBBtn = document.getElementById('optionBBtn');
      const optionAText = document.getElementById('optionAText');
      const optionBText = document.getElementById('optionBText');
      const modeDescription = document.getElementById('modeDescription');
      const swapBtn = document.getElementById('swapBtn');
      const pasteBtn = document.getElementById('pasteBtn');
      const sampleBtn = document.getElementById('sampleBtn');
      const clearBtn = document.getElementById('clearBtn');
      const copyTriggers = document.querySelectorAll('.copy-trigger');
      const openLinkBtn = document.getElementById('openLinkBtn');
      const linkPreviewBox = document.getElementById('linkPreviewBox');
      const previewAnchor = document.getElementById('previewAnchor');
      const warningBanner = document.getElementById('warningBanner');
      const warningText = document.getElementById('warningText');
      const toast = document.getElementById('toast');
      const toastIcon = document.getElementById('toastIcon');
      const toastText = document.getElementById('toastText');

      // 原始碼區塊元素
      const toggleSourceBtn = document.getElementById('toggleSourceBtn');
      const toggleSourceArrow = document.getElementById('toggleSourceArrow');
      const sourceCodePanel = document.getElementById('sourceCodePanel');
      const fullSourceTextarea = document.getElementById('fullSourceTextarea');
      const copyFullSourceBtn = document.getElementById('copyFullSourceBtn');
      const copySourceIcon = document.getElementById('copySourceIcon');
      const copySourceLabel = document.getElementById('copySourceLabel');

      // 狀態變數
      let direction = 'decode';       // 'decode' | 'encode'
      let decodeOption = 'keepSpace'; // 'keepSpace' | 'full'
      let encodeOption = 'smartUri';  // 'smartUri' | 'component'
      let toastTimer = null;
      let copyResetTimer = null;
      let sourceCopyResetTimer = null;

      /**
       * 顯示畫面底部 Toast 提示訊息
       */
      function showToast(message, icon = '✅') {
        toastText.textContent = message;
        toastIcon.textContent = icon;
        toast.classList.remove('opacity-0', 'translate-y-3');
        toast.classList.add('opacity-100', 'translate-y-0');

        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-3');
        }, 2400);
      }

      /**
       * 通用安全複製文字函式（支援 iframe 與各種瀏覽器環境）
       */
      async function copyTextSafely(text) {
        if (!text) return false;

        // 優先嘗試 Clipboard API
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (_) {
            // 失敗時退回至 execCommand
          }
        }

        // 備援方案：建立暫存 textarea 執行 execCommand('copy')
        try {
          const tempArea = document.createElement('textarea');
          tempArea.value = text;
          tempArea.setAttribute('readonly', '');
          tempArea.style.position = 'fixed';
          tempArea.style.top = '-9999px';
          tempArea.style.left = '-9999px';
          document.body.appendChild(tempArea);
          tempArea.select();
          tempArea.setSelectionRange(0, tempArea.value.length);
          const success = document.execCommand('copy');
          document.body.removeChild(tempArea);
          return success;
        } catch (_) {
          return false;
        }
      }

      /**
       * 安全解碼單一字串片段，遇到截斷或不完整的 % 序列時自動容錯保留原始字元
       */
      function safeDecodeChunk(chunk) {
        try {
          return { decoded: decodeURIComponent(chunk), hasMalformed: false };
        } catch (_) {
          let hasMalformed = false;
          // 逐段匹配合法的 UTF-8 百分比編碼序列並解碼，其餘無效的 % 片段原樣保留
          const recovered = chunk.replace(/(?:%[0-9A-Fa-f]{2})+/g, (seq) => {
            try {
              return decodeURIComponent(seq);
            } catch (e) {
              hasMalformed = true;
              return seq;
            }
          });

          // 檢查是否仍存在孤立或不完整的 %（例如 %E 或 %2G）
          if (/%(?![0-9A-Fa-f]{2})/.test(recovered)) {
            hasMalformed = true;
          }

          return { decoded: recovered, hasMalformed };
        }
      }

      /**
       * 執行解碼運算（還原解碼模式）
       */
      function decodeUrlString(rawInput, mode) {
        if (!rawInput) {
          return { result: '', warning: '' };
        }

        if (mode === 'full') {
          const { decoded, hasMalformed } = safeDecodeChunk(rawInput);
          return {
            result: decoded,
            warning: hasMalformed
              ? '偵測到部分不完整或無效的百分比編碼（例如截斷的 %E5），已自動保留異常字元並完成其餘部分解碼。'
              : ''
          };
        }

        // 預設模式：保留 %20（防通訊軟體斷行），其餘 UTF-8 百分比編碼還原為可讀文字
        const segments = rawInput.split(/(%20)/gi);
        let anyMalformed = false;

        const processed = segments.map((seg) => {
          if (/^%20$/i.test(seg)) {
            return '%20';
          }
          const { decoded, hasMalformed } = safeDecodeChunk(seg);
          if (hasMalformed) {
            anyMalformed = true;
          }
          return decoded;
        });

        return {
          result: processed.join(''),
          warning: anyMalformed
            ? '偵測到部分不完整或無效的百分比編碼（例如截斷的 %E5），已自動保留異常字元並完成其餘部分解碼。'
            : ''
        };
      }

      /**
       * 執行反向編碼運算（反向編碼模式）
       */
      function encodeUrlString(rawInput, mode) {
        if (!rawInput) {
          return { result: '', warning: '' };
        }

        if (mode === 'component') {
          // 完整字串編碼：encodeURIComponent
          try {
            return { result: encodeURIComponent(rawInput), warning: '' };
          } catch (_) {
            const sanitized = rawInput.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g, '\uFFFD');
            return {
              result: encodeURIComponent(sanitized),
              warning: '輸入包含異常的 Unicode 代理字元，已自動修正並完成完整字串編碼。'
            };
          }
        }

        // 預設模式：智慧網址編碼
        // 保留 https://、/、?、&、=、# 等網址結構，且智慧偵測已存在的合法 %XX 序列避免重複編碼成 %2520
        const tokens = rawInput.split(/(%[0-9A-Fa-f]{2})/g);
        let hasLoneSurrogate = false;

        const encodedTokens = tokens.map((token) => {
          if (/^%[0-9A-Fa-f]{2}$/.test(token)) {
            return token.toUpperCase();
          }
          try {
            return encodeURI(token);
          } catch (_) {
            hasLoneSurrogate = true;
            const sanitized = token.replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?:[^\uD800-\uDBFF]|^)[\uDC00-\uDFFF]/g, '\uFFFD');
            return encodeURI(sanitized);
          }
        });

        return {
          result: encodedTokens.join(''),
          warning: hasLoneSurrogate
            ? '輸入包含異常的 Unicode 代理字元，已自動修正並完成智慧網址編碼。'
            : ''
        };
      }

      /**
       * 驗證輸出是否為單一有效的 http:// 或 https:// 網址
       */
      function extractValidHttpUrl(str) {
        const trimmed = str.trim();
        if (!trimmed) return null;

        const lines = trimmed.split(/\r?\n/);
        if (lines.length > 1) return null;

        const singleLine = lines[0];
        if (!/^https?:\/\/\S+/i.test(singleLine)) {
          return null;
        }

        try {
          const normalized = singleLine.replace(/ /g, '%20');
          const urlObj = new URL(normalized);
          if (urlObj.protocol === 'http:' || urlObj.protocol === 'https:') {
            return normalized;
          }
        } catch (_) {
          return null;
        }
        return null;
      }

      /**
       * 執行即時轉換並更新所有介面狀態
       */
      function processConversion() {
        const raw = inputEl.value;
        inputCharCount.textContent = `${raw.length} 字元`;

        const { result, warning } = direction === 'decode'
          ? decodeUrlString(raw, decodeOption)
          : encodeUrlString(raw, encodeOption);

        outputEl.value = result;
        outputCharCount.textContent = `${result.length} 字元`;

        // 顯示或隱藏溫和淡琥珀色容錯提示橫幅
        if (warning && raw.trim() !== '') {
          warningText.textContent = warning;
          warningBanner.classList.remove('hidden');
        } else {
          warningBanner.classList.add('hidden');
        }

        // 處理有效網址的超連結預覽與新分頁開啟按鈕
        const validHref = extractValidHttpUrl(result);
        if (validHref) {
          openLinkBtn.href = validHref;
          openLinkBtn.classList.remove('hidden');
          openLinkBtn.classList.add('inline-flex');

          previewAnchor.href = validHref;
          previewAnchor.textContent = result.trim();
          linkPreviewBox.classList.remove('hidden');
        } else {
          openLinkBtn.classList.add('hidden');
          openLinkBtn.classList.remove('inline-flex');
          linkPreviewBox.classList.add('hidden');
        }
      }

      /**
       * 更新子模式快捷選項膠囊（Pills）與說明文字
       */
      function renderSubOptionsUI() {
        const activePillClass = 'min-h-[42px] flex items-center justify-center sm:justify-start gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold border transition-all bg-[#238656] text-white border-[#238656] shadow-sm';
        const inactivePillClass = 'min-h-[42px] flex items-center justify-center sm:justify-start gap-2 px-4 py-2 rounded-full text-xs sm:text-sm font-semibold border transition-all bg-white text-[#174d33] border-[#c8e6d4] hover:bg-[#e8f6ee]';

        const isOptionA = direction === 'decode'
          ? decodeOption === 'keepSpace'
          : encodeOption === 'smartUri';

        optionABtn.setAttribute('aria-checked', isOptionA ? 'true' : 'false');
        optionABtn.className = isOptionA ? activePillClass : inactivePillClass;
        optionABtn.querySelector('span:first-child').className = isOptionA
          ? 'w-2 h-2 rounded-full bg-white shrink-0'
          : 'w-2 h-2 rounded-full bg-[#9fd4b5] shrink-0';

        optionBBtn.setAttribute('aria-checked', !isOptionA ? 'true' : 'false');
        optionBBtn.className = !isOptionA ? activePillClass : inactivePillClass;
        optionBBtn.querySelector('span:first-child').className = !isOptionA
          ? 'w-2 h-2 rounded-full bg-white shrink-0'
          : 'w-2 h-2 rounded-full bg-[#9fd4b5] shrink-0';

        if (direction === 'decode') {
          subModeTitle.textContent = '還原解碼選項：';
          optionAText.textContent = '保留 %20（防斷行，預設）';
          optionBText.textContent = '完全解碼（含空白轉空格）';

          if (decodeOption === 'keepSpace') {
            modeDescription.innerHTML = '目前模式：將 UTF-8 編碼還原為可讀中文字，並保留 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">%20</code>，確保貼到 LINE、Messenger 或文件中不會因空白而截斷超連結。';
          } else {
            modeDescription.innerHTML = '目前模式：完全解碼所有百分比編碼（包含將 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">%20</code> 還原為一般空白鍵），適合純文字閱讀與內容檢視。';
          }
        } else {
          subModeTitle.textContent = '反向編碼選項：';
          optionAText.textContent = '智慧網址編碼（預設）';
          optionBText.textContent = '完整字串編碼（encodeURIComponent）';

          if (encodeOption === 'smartUri') {
            modeDescription.innerHTML = '目前模式：保留 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">https://</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">/</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">?</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">&amp;</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">=</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">#</code> 等結構，且不重複編碼既有的 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">%XX</code>。';
          } else {
            modeDescription.innerHTML = '目前模式：使用 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">encodeURIComponent</code> 將所有非英數符號（含 <code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">/</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">:</code>、<code class="px-1.5 py-0.5 rounded-md bg-[#e8f6ee] text-[#174d33] font-mono font-semibold">?</code>）完整編碼，適合用於查詢參數值。';
          }
        }
      }

      /**
       * 切換頂部雙向轉換方向（還原解碼 vs 反向編碼）
       */
      function setDirection(newDirection, options = {}) {
        const { autoFillSampleIfDefault = false } = options;
        const prevDirection = direction;
        direction = newDirection;

        const activeSegClass = 'min-h-[48px] flex items-center justify-center gap-2.5 px-4 py-3 rounded-2xl text-sm sm:text-base font-bold transition-all bg-[#238656] text-white shadow-md shadow-[#238656]/20';
        const inactiveSegClass = 'min-h-[48px] flex items-center justify-center gap-2.5 px-4 py-3 rounded-2xl text-sm sm:text-base font-semibold transition-all bg-white/80 text-[#174d33] hover:bg-white border border-[#c8e6d4]/80';

        if (direction === 'decode') {
          dirDecodeBtn.setAttribute('aria-selected', 'true');
          dirDecodeBtn.className = activeSegClass;

          dirEncodeBtn.setAttribute('aria-selected', 'false');
          dirEncodeBtn.className = inactiveSegClass;

          inputLabelText.textContent = '原始編碼網址';
          outputLabelText.textContent = '還原後可讀連線網址';
          inputEl.placeholder = '請在此貼上或輸入包含 %E5%8F%B0... 的編碼網址';
          inputEl.classList.add('font-mono');
          outputEl.classList.remove('font-mono');

          if (autoFillSampleIfDefault && prevDirection !== 'decode' && inputEl.value.trim() === READABLE_SAMPLE_URL) {
            inputEl.value = ENCODED_SAMPLE_URL;
          }
        } else {
          dirEncodeBtn.setAttribute('aria-selected', 'true');
          dirEncodeBtn.className = activeSegClass;

          dirDecodeBtn.setAttribute('aria-selected', 'false');
          dirDecodeBtn.className = inactiveSegClass;

          inputLabelText.textContent = '可讀網址或文字';
          outputLabelText.textContent = '轉換後百分比編碼網址';
          inputEl.placeholder = '請在此貼上或輸入包含中文或空白的網址（例如：https://d.jwint.net/2026%20年台灣米其林必比登推介）';
          inputEl.classList.remove('font-mono');
          outputEl.classList.add('font-mono');

          if (autoFillSampleIfDefault && prevDirection !== 'encode' && inputEl.value.trim() === ENCODED_SAMPLE_URL) {
            inputEl.value = READABLE_SAMPLE_URL;
          }
        }

        renderSubOptionsUI();
        processConversion();
      }

      /**
       * 上下互換：將目前輸出結果帶入輸入框並自動切換轉換方向
       */
      function swapInputAndOutput() {
        const currentOutput = outputEl.value;
        if (!currentOutput) {
          showToast('目前沒有可互換的輸出結果', 'ℹ️');
          return;
        }

        inputEl.value = currentOutput;
        const nextDirection = direction === 'decode' ? 'encode' : 'decode';
        setDirection(nextDirection, { autoFillSampleIfDefault: false });
        showToast(nextDirection === 'encode' ? '已上下互換並切換為「反向編碼」' : '已上下互換並切換為「還原解碼」', '⇅');
      }

      /**
       * 從剪貼簿貼上文字
       */
      async function pasteFromClipboard() {
        try {
          if (navigator.clipboard && navigator.clipboard.readText) {
            const text = await navigator.clipboard.readText();
            if (text) {
              inputEl.value = text;
              processConversion();
              showToast('已從剪貼簿貼上內容', '📋');
              return;
            }
          }
          inputEl.focus();
          showToast('請直接使用 Ctrl+V 或長按貼上', 'ℹ️');
        } catch (_) {
          inputEl.focus();
          showToast('瀏覽器限制自動讀取剪貼簿，請按 Ctrl+V 貼上', 'ℹ️');
        }
      }

      /**
       * 一鍵複製轉換結果並切換按鈕視覺回饋
       */
      async function handleCopyResult() {
        const resultText = outputEl.value;
        if (!resultText) {
          showToast('目前沒有可複製的結果', 'ℹ️');
          return;
        }

        const success = await copyTextSafely(resultText);
        if (success) {
          copyTriggers.forEach((btn) => {
            btn.classList.remove('bg-[#238656]', 'hover:bg-[#1b6e46]');
            btn.classList.add('bg-[#163024]', 'hover:bg-[#163024]');
            btn.querySelector('.copy-icon').textContent = '✅';
            btn.querySelector('.copy-label').textContent = '已複製！';
          });

          showToast('已複製轉換結果到剪貼簿！', '✅');

          if (copyResetTimer) clearTimeout(copyResetTimer);
          copyResetTimer = setTimeout(() => {
            copyTriggers.forEach((btn) => {
              btn.classList.remove('bg-[#163024]', 'hover:bg-[#163024]');
              btn.classList.add('bg-[#238656]', 'hover:bg-[#1b6e46]');
              btn.querySelector('.copy-icon').textContent = '📄';
              btn.querySelector('.copy-label').textContent = '一鍵複製結果';
            });
          }, 2200);
        } else {
          outputEl.select();
          showToast('自動複製受限，已為您全選文字，請按 Ctrl+C 複製', 'ℹ️');
        }
      }

      /**
       * 取得乾淨的完整頁面 HTML 原始碼（排除動態填入的 textarea 執行期文字）
       */
      function getCleanPageHtmlSource() {
        const cloneDoc = document.documentElement.cloneNode(true);
        const clonedSourceArea = cloneDoc.querySelector('#fullSourceTextarea');
        if (clonedSourceArea) {
          clonedSourceArea.textContent = '';
        }
        const clonedSourcePanel = cloneDoc.querySelector('#sourceCodePanel');
        if (clonedSourcePanel) {
          clonedSourcePanel.classList.add('hidden');
        }
        const clonedToggleBtn = cloneDoc.querySelector('#toggleSourceBtn');
        if (clonedToggleBtn) {
          clonedToggleBtn.setAttribute('aria-expanded', 'false');
        }
        const clonedArrow = cloneDoc.querySelector('#toggleSourceArrow');
        if (clonedArrow) {
          clonedArrow.textContent = '展開 ▼';
        }
        return '<!DOCTYPE html>\n' + cloneDoc.outerHTML;
      }

      // 綁定雙向與選項事件
      dirDecodeBtn.addEventListener('click', () => setDirection('decode', { autoFillSampleIfDefault: true }));
      dirEncodeBtn.addEventListener('click', () => setDirection('encode', { autoFillSampleIfDefault: true }));

      inputEl.addEventListener('input', processConversion);

      optionABtn.addEventListener('click', () => {
        if (direction === 'decode') {
          decodeOption = 'keepSpace';
        } else {
          encodeOption = 'smartUri';
        }
        renderSubOptionsUI();
        processConversion();
      });

      optionBBtn.addEventListener('click', () => {
        if (direction === 'decode') {
          decodeOption = 'full';
        } else {
          encodeOption = 'component';
        }
        renderSubOptionsUI();
        processConversion();
      });

      swapBtn.addEventListener('click', swapInputAndOutput);
      pasteBtn.addEventListener('click', pasteFromClipboard);

      sampleBtn.addEventListener('click', () => {
        inputEl.value = direction === 'decode' ? ENCODED_SAMPLE_URL : READABLE_SAMPLE_URL;
        processConversion();
        showToast(direction === 'decode' ? '已填入編碼網址範例' : '已填入可讀網址範例', '✨');
      });

      clearBtn.addEventListener('click', () => {
        inputEl.value = '';
        processConversion();
        inputEl.focus();
        showToast('已清空輸入內容', '🗑️');
      });

      copyTriggers.forEach((btn) => {
        btn.addEventListener('click', handleCopyResult);
      });

      // 折疊／展開「檢視完整 HTML 原始碼」區塊
      toggleSourceBtn.addEventListener('click', () => {
        const isHidden = sourceCodePanel.classList.contains('hidden');
        if (isHidden) {
          if (!fullSourceTextarea.value) {
            fullSourceTextarea.value = getCleanPageHtmlSource();
          }
          sourceCodePanel.classList.remove('hidden');
          toggleSourceBtn.setAttribute('aria-expanded', 'true');
          toggleSourceArrow.textContent = '收合 ▲';
        } else {
          sourceCodePanel.classList.add('hidden');
          toggleSourceBtn.setAttribute('aria-expanded', 'false');
          toggleSourceArrow.textContent = '展開 ▼';
        }
      });

      // 複製完整 HTML 原始碼
      copyFullSourceBtn.addEventListener('click', async () => {
        const codeText = fullSourceTextarea.value || getCleanPageHtmlSource();
        const success = await copyTextSafely(codeText);
        if (success) {
          copySourceIcon.textContent = '✅';
          copySourceLabel.textContent = '已複製完整程式碼！';
          showToast('已複製完整 HTML 原始碼！', '✅');

          if (sourceCopyResetTimer) clearTimeout(sourceCopyResetTimer);
          sourceCopyResetTimer = setTimeout(() => {
            copySourceIcon.textContent = '📋';
            copySourceLabel.textContent = '複製完整程式碼';
          }, 2200);
        } else {
          fullSourceTextarea.select();
          showToast('自動複製受限，已全選原始碼，請按 Ctrl+C 複製', 'ℹ️');
        }
      });

      // 初始化介面並執行預設範例轉換
      renderSubOptionsUI();
      processConversion();
    })();
  </script>
</body>
</html>
