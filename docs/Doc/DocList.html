<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doc List</title>
    <!-- 引入 CryptoJS 來計算 MD5 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        /* 全域設定：背景淡綠色，並置中內容 */
        body {
            margin: 0;
            padding: 0;
            background-color: #e8f5e9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
        }

        /* 容器：上下滿版、左右最大 1024px */
        .container {
            width: 100%;
            max-width: 1024px;
            min-height: 100vh;
            background: #ffffff;
            padding: 30px;
            box-sizing: border-box; /* 確保 padding 不會撐破 100vh */
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        a , a:visited{
            text-decoration: none;
            color: darkslategray;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* 輸入區塊排版 */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input {
            padding: 14px;
            font-size: 16px;
            border: 1px solid #c8e6c9;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #4caf50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        button {
            padding: 14px;
            font-size: 16px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #43a047;
        }

        button:active {
            background-color: #388e3c;
        }

        button:disabled {
            background-color: gray;
        }

        /* 列表區塊排版：利用 flex 填滿剩餘高度 */
        #result {
            margin-top: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 限制區塊高度，讓 ul 負責捲動 */
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            flex: 1;
            overflow-y: auto; /* 只有列表區域會出現捲軸 */
            padding-right: 5px;
        }

        /* 自訂捲軸樣式 (美化) */
        ul::-webkit-scrollbar {
            width: 8px;
        }
        ul::-webkit-scrollbar-track {
            background: #f1f8e9; 
            border-radius: 4px;
        }
        ul::-webkit-scrollbar-thumb {
            background: #a5d6a7; 
            border-radius: 4px;
        }
        ul::-webkit-scrollbar-thumb:hover {
            background: #81c784; 
        }

        li {
            background: #f1f8e9;
            margin-bottom: 10px;
            padding: 15px;
            border-left: 5px solid #8bc34a;
            border-radius: 6px;
            color: #333;
            word-break: break-all;
            font-family: monospace;
            font-size: 15px;
        }

        /* 狀態訊息樣式 */
        .status {
            text-align: center;
            color: #666;
            font-weight: normal;
            border-left: none;
            background: transparent;
        }

        .error {
            border-left: 5px solid #f44336;
            background: #ffebee;
            color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>文章列表</h1>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="口令" />
            <button id="fetchBtn">開始取得列表</button>
        </div>

        <div id="result">
            <ul id="keyList">
                <li class="status">請輸入網址與密碼後點擊按鈕</li>
            </ul>
        </div>
    </div>

    <script src="DocList.js"></script>
</body>
</html>
