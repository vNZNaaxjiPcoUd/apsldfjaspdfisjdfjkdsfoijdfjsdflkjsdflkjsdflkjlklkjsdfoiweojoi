<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title data-i18n="page_title">聊天 🌿</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <!--link rel="manifest" href="manifest.json"-->
    <script>
        // PWA Manifest
        (function() {
            let currentUrl = window.location.href;
            let dbId = "";
            if (currentUrl.includes('id=')) dbId = currentUrl.split('id=')[1].split('&')[0];
            else if (currentUrl.includes('?')) dbId = currentUrl.split('?')[1].split('&')[0];

            const manifestName = dbId ? dbId : "Sky聊天";
            const startUrl = new URL(`./index.html${dbId ? '?id=' + dbId : ''}`, currentUrl).href;
            const icon192Url = new URL('./favicon192.png', currentUrl).href;
            const icon512Url = new URL('./favicon512.png', currentUrl).href;

            const manifest = {
                "name": `Items - ${manifestName}`,
                "short_name": manifestName,
                "description": `(${manifestName})`,
                "start_url": startUrl,
                "display": "standalone",
                "background_color": "#f1f8f1",
                "theme_color": "#66bb6a",
                "icons": [
                    { "src": icon192Url, "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
                    { "src": icon512Url, "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
                ]
            };
            const stringManifest = JSON.stringify(manifest);
            const blob = new Blob([stringManifest], { type: 'application/json' });
            const manifestURL = URL.createObjectURL(blob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestURL;
            document.head.appendChild(link);
        })();

    </script>

    <style>
        :root { 
            --primary-green: #73c89a;
            --primary-dark: #5bb382;
            --bg-color: #eaf6ef;
            --chat-bg: #ffffff;
            --msg-self-bg: #d2f8e4;
            --msg-other-bg: #ffffff;
            --text-main: #2d3e34;
            --text-light: #7b9685;
        }
        
        * { 
            box-sizing: border-box; 
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }
        
        body { 
            margin: 0; 
            padding: 0; 
            /* 修正1：取消 bottom 和 right，改用寬高 100%，並加入 100dvh 支援 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%; 
            height: 100dvh; 
            background-color: var(--bg-color); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
        }
        
        #setup-screen, #chat-screen { 
            width: 100%; 
            max-width: 600px; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            background: var(--chat-bg); 
            position: relative; 
        }
        
        @media (min-width: 601px) {
            #setup-screen, #chat-screen {
                height: 90%;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(91, 179, 130, 0.15); 
                overflow: hidden;
            }
        }

        #chat-screen { display: none; }
        
        /* ======== 多國語系切換按鈕 ======== */
        .lang-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--primary-green);
            color: var(--primary-dark);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.65em;
            font-weight: 500;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .lang-btn:active {
            background: var(--primary-green);
            color: white;
        }

        /* ======== 1. 頂部標題極簡化 ======== */
        .header { 
            background: linear-gradient(135deg, #81d4a8, #5bb382); 
            color: white; 
            padding: 8px 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex: 0 0 auto; 
            font-weight: 700;
            font-size: 0.9em; 
            z-index: 10;
            padding-right: 70px;
        }

        #room-title {
            font-size: 1.1em;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .online-status {
            font-size: 0.85em;
            font-weight: 600;
            opacity: 0.95;
            white-space: nowrap;
            margin-right: 20px;
        }
        
        /* ======== 2. 訊息區與單行泡泡 ======== */
        #messages { 
            flex: 1 1 auto; 
            overflow-y: auto; 
            padding: 10px 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            background-color: #fafdfb;
            /* 讓捲動更順暢 */
            -webkit-overflow-scrolling: touch;
        }

        .msg { 
            padding: 6px 10px; 
            width: 100%; 
            max-width: 100%; 
            line-height: 1.4; 
            word-wrap: break-word; 
            color: var(--text-main);
            border-radius: 6px;
            display: flex;
            flex-direction: row;
            align-items: baseline;
            gap: 5px;
        }
        
        .msg.self { 
            background: var(--msg-self-bg); 
            border-left: 3px solid var(--primary-green);
        }
        .msg.other { 
            background: var(--msg-other-bg); 
            border-bottom: 1px solid #f0f5f2; 
        }
        
        .msg-name { 
            font-size: 0.9em; 
            color: var(--primary-dark); 
            font-weight: 700;
            white-space: nowrap; 
            margin: 0;
        }
        
        .msg-name::after {
            content: "：";
        }
        
        /* ======== 3. 輸入區扁平化 ======== */
        #input-area { 
            flex: 0 0 auto; 
            display: flex; 
            padding: 8px 10px; 
            gap: 8px; 
            background: var(--chat-bg); 
            padding-bottom: calc(8px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #e0ebe4;
            z-index: 10;
        }
        
        input[type="text"] { 
            flex: 1; 
            padding: 8px 15px; 
            border: 1px solid #e0ebe4; 
            border-radius: 20px; 
            font-size: 16px; 
            outline: none;
            background: #f9fcf9;
            transition: border-color 0.2s;
            color: var(--text-main);
        }
        
        input[type="text"]:focus {
            border-color: var(--primary-green);
            background: #ffffff;
        }
        
        input::placeholder { color: #a4bdaf; }

        button { 
            padding: 8px 16px; 
            margin: 0; 
            border: none; 
            background: var(--primary-green); 
            color: white; 
            border-radius: 20px; 
            cursor: pointer; 
            font-size: 15px;
            font-weight: 700;
        }
        
        button:active { 
            background: var(--primary-dark);
        }
        
        /* ======== 設定畫面 ======== */
        #setup-screen { justify-content: center; padding: 20px; text-align: center; }
        #setup-screen h2 { color: var(--primary-dark); margin-bottom: 5px; font-size: 1.8em; }
        .input-row { flex-direction: column; display: flex; gap: 10px; width: 100%; margin: 15px 0; }
        .input-col { flex: 1; display: flex; flex-direction: column; text-align: left; }
        .input-col label { color: var(--primary-dark); font-size: 0.85em; font-weight: 700; margin-bottom: 5px; margin-left: 5px; }
        #setup-screen .input-row input { width: 100%; padding: 10px 15px; }
        #setup-screen button.main-btn { padding: 12px; font-size: 16px; width: 100%; max-width: 300px; margin: 0 auto; }
        @media (max-width: 400px) { .input-row { flex-direction: column; gap: 10px; } }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 登入設定畫面 -->
    <div id="setup-screen">
        <button class="lang-btn" onclick="toggleLanguage()">中／EN</button>
        <h2 data-i18n="setup_title">🌱 歡迎聊天室</h2>
        
        <div class="input-row">
            <div class="input-col">
                <input type="text" id="setup-room" data-i18n-placeholder="setup_room_ph" placeholder="房間名稱" autocomplete="off" value="Sky天空">
            </div>
            <div class="input-col">
                <input type="text" id="setup-name" data-i18n-placeholder="setup_name_ph" placeholder="暱稱 例如: ฅ^•ﻌ•^ฅ" autocomplete="off" onkeydown="if(event.key === 'Enter') joinChat()">
            </div>
        </div>
        <button class="main-btn" onclick="joinChat()" data-i18n="setup_btn">開始聊天 🚀</button>
    </div>

    <!-- 聊天主畫面 -->
    <div id="chat-screen">
        <button class="lang-btn" onclick="toggleLanguage()" >中／EN</button>
        <div class="header">
            <span id="room-title">Room</span>
            <span class="online-status">🟢 <span data-i18n="online_label">在線:</span> <span id="online-count">1</span></span>
        </div>
        
        <div id="messages"></div>
        
        <div id="input-area">
            <input type="text" id="msg-input" data-i18n-placeholder="chat_input_ph" placeholder="輸入訊息..." autocomplete="off">
            <button onclick="sendMsg()" id="send-btn" data-i18n="chat_send_btn">發送</button>
        </div>
    </div>

    <!-- 原有邏輯腳本 -->
    <script src="cs.js"></script>

    <!-- ======== 4. 解決手機鍵盤擋畫面與偏移的終極腳本 ======== -->
    <script>
        if (window.visualViewport) {
            const viewportHandler = () => {
                // 修正 2：強制 body 高度等於鍵盤彈出後的剩餘可視高度
                document.body.style.height = window.visualViewport.height + 'px';
                
                // 修正 3：利用 offsetTop 將 body 往下推回可視區域，抵銷瀏覽器的強制捲動
                document.body.style.top = window.visualViewport.offsetTop + 'px';
                
                // 自動捲動到最新訊息
                const messages = document.getElementById('messages');
                if (messages) {
                    messages.scrollTop = messages.scrollHeight;
                }
            };

            // 同時監聽 resize (高度改變) 與 scroll (畫面被推移)
            window.visualViewport.addEventListener('resize', viewportHandler);
            window.visualViewport.addEventListener('scroll', viewportHandler);
            
            // 初始化執行一次
            viewportHandler();
        }

        // 解決鍵盤收起後，畫面不歸位留白的問題
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                }, 100);
            });
        });
        
        // 進入網頁自動 Focus
        document.getElementById("setup-name").focus();
    </script>
</body>
</html>
