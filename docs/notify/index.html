<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notification</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #f2fcf6;
            margin: 0;
            display: flex;
            justify-content: center;
            /* 修改重點 1：改為 flex-start 讓對話框靠上對齊 */
            align-items: flex-start;
            /* 修改重點 2：改用 min-height 與 dvh 以適應手機動態高度 */
            min-height: 100dvh;
            /* 修改重點 3：增加頂部間距，避免對話框緊貼螢幕邊緣 */
            padding-top: 5vh;
            color: #4a7c59; 
        }

        .chat-container {
            background-color: #ffffff;
            border: 2px solid #b8e0d2;
            border-radius: 24px; 
            padding: 24px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 10px 20px rgba(168, 230, 207, 0.3); 
        }

        .input-group {
            display: flex;
            flex-direction: column; 
            gap: 15px; 
            align-items: stretch; 
        }

        input, textarea {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: inherit; 
            border: 2px solid #d1eadd;
            border-radius: 16px; 
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #80c4a3;
            box-shadow: 0 0 8px rgba(128, 196, 163, 0.4);
        }

        textarea {
            resize: vertical; 
            min-height: 80px; 
            max-height: 200px; 
        }

        button {
            width: 100%; 
            background-color: #a8e6cf; 
            color: #2c543e; 
            border: none;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px; 
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s, transform 0.1s;
            height: 50px; 
        }

        button:hover {
            background-color: #8cd8be;
        }

        button:active {
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="input-group">
            <input id="name" placeholder="Name">
            <textarea id="msgInput" placeholder="Message"></textarea>
            <button id="sendBtn">Go!</button>
        </div>
    </div>

    <script src="notify.js"></script>
    <script>
        const msgInputElement = document.getElementById('msgInput');
        const sendBtnElement = document.getElementById('sendBtn');
        const uName = document.getElementById('name');

        async function handleSend() {
            const textValue = msgInputElement.value.trim();
            let name = uName.value.trim();
            name = name ? name : "nono";

            if (textValue !== "") {
                const ret = await sendMsg(name, textValue);
                if ( ret === false ) console.log("notify fail");
                
                msgInputElement.value = "";
                msgInputElement.focus();
            }
        }

        msgInputElement.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); 
                handleSend();
            }
        });

        sendBtnElement.addEventListener('click', function() {
            handleSend();
        });
    </script>
</body>
</html>
