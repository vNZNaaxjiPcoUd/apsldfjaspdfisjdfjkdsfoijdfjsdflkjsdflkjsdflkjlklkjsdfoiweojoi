<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入</title>
    <style>
        :root {
            /* 淡綠色主題色系定義 */
            --bg: #eafbf1;           /* 淡綠色背景 */
            --card: #ffffff;         /* 白色卡片背景 */
            --primary: #4caf50;      /* 主色調：綠色 */
            --primary-dark: #388e3c; /* 深綠色：用於標題與懸停狀態 */
            --border: #c8e6c9;       /* 邊框淺綠色 */
            --text: #2e3d32;         /* 深綠灰色文字 */
            --text-light: #556b58;   /* 淺綠灰色標籤文字 */
            --danger: #e53935;       /* 錯誤提示紅色 */
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg);
        }

        /* 登入畫面 */
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-card { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border: 1px solid var(--border); box-sizing: border-box; }
        .login-card h2 { margin-top: 0; color: var(--primary-dark); margin-bottom: 20px; }
        .login-card .input-group-login { margin-bottom: 15px; text-align: left; }
        .login-card label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-light); font-size: 0.9rem; }
        .login-card input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; color: var(--text); outline-color: var(--primary); box-sizing: border-box; }
        .login-card button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .login-card button:hover { background: var(--primary-dark); }
        .login-card button:disabled { background: var(--border); cursor: not-allowed; }
        .login-error { color: var(--danger); font-size: 0.9rem; margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>🔒 筆記本</h2>
            <div class="input-group-login">
                <label>冊名</label>
                <input type="text" id="login-db-name" placeholder="輸入書冊名稱" onkeydown="if(event.key === 'Enter') document.getElementById('login-password').focus()">
            </div>
            <div class="input-group-login">
                <label>鑰匙</label>
                <input type="password" id="login-password" placeholder="輸入鑰匙" onkeydown="if(event.key === 'Enter') attemptLogin()">
            </div>
            <button id="login-btn" onclick="attemptLogin()">登入</button>
            <div id="login-error" class="login-error"></div>
        </div>
    </div>

    <script>
        async function attemptLogin() {
            const bookName = document.getElementById('login-db-name').value.trim();
            const pwdInput = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            if (!bookName || !pwdInput) {
                errorMsg.innerText = "請完整輸入冊名與鑰匙！";
                return;
            }

            // 修正原始程式碼中 dbNameInput 變數未定義的問題
            document.title = bookName;

            errorMsg.innerText = "";
            loginBtn.innerText = "載入中...";
            loginBtn.disabled = true;

            // 模擬驗證並執行跳轉
            //setTimeout(() => {
                // 將網址修改為 /#bookName=pwdInput 格式
                // 對於本機 HTML 檔案，修改 hash 將不會刷新頁面但會更新網址列
                //window.location.hash = `${encodeURIComponent(bookName)}=${encodeURIComponent(pwdInput)}`;
                loginBtn.innerText = "登入成功";
                
                // 若要強制跳轉到特定網域，請取消註解以下程式碼並依需求調整：
                // window.location.href = `https://url.com/#${encodeURIComponent(bookName)}=${encodeURIComponent(pwdInput)}`;
                const book = encodeURIComponent(bookName);
                const pwd = encodeURIComponent(pwdInput);
                //window.location.href = `https://app.jwint.net/lNote/#${book}=${pwd}`;
                window.location.replace(`https://app.jwint.net/lNote/#${book}=${pwd}`);
                //console.log(`https://app.jwint.net/lNote/#${book}=${pwd}`);
            //}, 500);
        } 
    </script>
</body>
</html>
