<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="./manifest.json">
    <title>Editor</title>
    <script src="./marked.min.js"></script>
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <header>
        <button class="menu-btn" id="menuBtn">☰</button>
        <input type="text" id="filenameInput" class="header-title" placeholder="輸入檔名...">
        <div class="menu-dropdown" id="menuDropdown">
            <label for="file-input">📂 讀取檔案</label>
            <input type="file" id="file-input" accept=".txt,.md">
            <button id="saveBtn">💾 儲存檔案</button>
            <button id="newWin">🪟 新視窗</button>
            <button id="fontUpBtn">A+ 放大字體</button>
            <button id="fontDownBtn">A- 縮小字體</button>
            <button id="previewBtn">👁️ 預覽 Markdown</button>
        </div>
    </header>
    <div class="container">
        <textarea id="editor" placeholder="在此輸入純文字或 Markdown 語法..."></textarea>
        <div id="preview"></div>
    </div>

    <script defer src="./editor.js"></script>
</body>
</html>
