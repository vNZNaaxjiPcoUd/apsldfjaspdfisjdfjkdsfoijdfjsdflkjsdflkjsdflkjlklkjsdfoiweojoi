<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開啟清單</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            border: 1px solid #444;
            border-radius: 6px;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #9aff9b;
        }

        button {
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            color: #121212;
            background-color: #9aff9b;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: #7ce87d;
        }

        button:active {
            transform: scale(0.98);
        }
        
        .hint {
            font-size: 13px;
            color: #888;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <!--h2>🎵 播放清單啟動</h2-->
        <div class="input-group">
            <input type="text" id="playlistIdInput" placeholder="貼" autocomplete="off">
            <button id="open" >開啟清單</button>
        </div>
        <!--div class="hint">支援直接貼上完整網址<br>(例如: https://www.youtube.com/playlist?list=PL...)</div-->
    </div>

    <script src="./ytListInput.org.js">
    </script>

</body>
</html>
