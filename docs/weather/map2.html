<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#3b82f6">
    <title>ECMWF HRES 全球氣象預測</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        /* 基礎重置 */
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #map { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10; 
            background-color: #e5e7eb;
        }
        
        /* 避免 Tailwind 破壞地圖與圖釘 (注意：不要加 margin:0，以免圖釘偏移) */
        .leaflet-container img {
            max-width: none !important;
            max-height: none !important;
        }
        
        .leaflet-control-container { z-index: 20 !important; position: relative; }
        #ui-panel { z-index: 50; }
        
        /* 隱藏滾動條但維持可滾動功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900">

    <div id="map"></div>

    <!-- 頂部提示/標題區 -->
    <div class="fixed top-4 left-1/2 transform -translate-x-1/2 z-[50] bg-white/90 dark:bg-gray-800/90 backdrop-blur-md px-6 py-3 rounded-full shadow-lg border border-gray-200/50 dark:border-gray-700/50 pointer-events-none transition-opacity duration-300" id="header-tip">
        <h1 class="text-sm md:text-base font-bold text-gray-800 dark:text-gray-100 flex items-center gap-2 whitespace-nowrap">
            <span>🌍</span> ECMWF 氣象地圖
        </h1>
        <p class="text-[11px] md:text-xs text-gray-500 dark:text-gray-400 text-center mt-0.5">請點擊地圖任意位置</p>
    </div>

    <!-- 自訂的現代化放大/縮小按鈕 (固定在右上角，手機易於操作且不被面板遮擋) -->
    <div class="fixed top-24 right-4 z-[40] flex flex-col gap-3">
        <button id="btn-zoom-in" class="w-12 h-12 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] border border-gray-200/50 dark:border-gray-700/50 rounded-2xl flex items-center justify-center text-gray-800 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-90 active:bg-gray-200 transition-all focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v12M6 12h12"></path></svg>
        </button>
        <button id="btn-zoom-out" class="w-12 h-12 bg-white/90 dark:bg-gray-800/90 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.15)] border border-gray-200/50 dark:border-gray-700/50 rounded-2xl flex items-center justify-center text-gray-800 dark:text-gray-100 hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-90 active:bg-gray-200 transition-all focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 12H4"></path></svg>
        </button>
    </div>

    <!-- 資訊面板 (針對手機端最佳化排版) -->
    <div id="ui-panel" class="fixed bottom-0 left-0 right-0 md:top-0 md:bottom-0 md:left-auto md:right-0 md:w-[400px] bg-white/95 dark:bg-gray-900/95 backdrop-blur-xl shadow-[0_-10px_40px_rgba(0,0,0,0.15)] md:shadow-[-10px_0_40px_rgba(0,0,0,0.15)] rounded-t-3xl md:rounded-none md:rounded-l-3xl transform translate-y-full md:translate-y-0 md:translate-x-full transition-transform duration-300 ease-out flex flex-col max-h-[85vh] md:max-h-full">
        
        <!-- 手機版拖曳把手 -->
        <div class="md:hidden flex justify-center pt-3 pb-2 cursor-pointer touch-none" id="close-handle">
            <div class="w-14 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full"></div>
        </div>

        <div class="flex-1 overflow-y-auto no-scrollbar p-6 pt-2 md:pt-8 pb-10">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-xl font-bold text-gray-800 dark:text-white">天氣資訊</h2>
                <button id="close-btn" class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 active:scale-90 transition-all bg-gray-50 dark:bg-gray-800/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- 載入狀態 -->
            <div id="loading-state" class="hidden flex-col items-center justify-center py-12">
                <div class="loader mb-4"></div>
                <p class="text-gray-500 dark:text-gray-400 text-sm font-medium">擷取最新氣象資料...</p>
            </div>

            <!-- 資料顯示區 -->
            <div id="data-state" class="hidden flex-col space-y-5">
                
                <div class="bg-blue-50/80 dark:bg-blue-900/20 p-3.5 rounded-2xl border border-blue-100 dark:border-blue-800/50 flex justify-between items-center">
                    <p class="text-xs text-blue-500 dark:text-blue-400 font-semibold uppercase tracking-wider">點擊座標</p>
                    <p id="coord-text" class="text-gray-800 dark:text-gray-200 font-mono text-xs md:text-sm font-medium">--</p>
                </div>

                <div class="flex items-center justify-between px-2 py-1">
                    <div class="flex flex-col">
                        <p class="text-6xl md:text-7xl font-light text-gray-900 dark:text-white flex items-start tracking-tighter">
                            <span id="temp-text">--</span><span class="text-2xl md:text-3xl mt-2 ml-1 text-gray-500 dark:text-gray-400">°C</span>
                        </p>
                        <p id="condition-text" class="text-lg md:text-xl text-gray-700 dark:text-gray-300 mt-1 font-medium">--</p>
                    </div>
                    <div id="weather-icon" class="text-7xl md:text-8xl drop-shadow-lg filter">🌤️</div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-700/50 flex flex-col justify-center">
                        <span class="text-2xl mb-1 drop-shadow-sm">💨</span>
                        <span class="text-[11px] text-gray-500 dark:text-gray-400 mb-0.5 font-medium">風速 (10m)</span>
                        <span id="wind-text" class="text-gray-800 dark:text-gray-100 font-bold text-sm md:text-base">-- km/h</span>
                    </div>
                    <div class="bg-gray-50 dark:bg-gray-800/50 p-3.5 rounded-2xl border border-gray-100 dark:border-gray-700/50 flex flex-col justify-center">
                        <span class="text-2xl mb-1 drop-shadow-sm">💧</span>
                        <span class="text-[11px] text-gray-500 dark:text-gray-400 mb-0.5 font-medium">相對濕度</span>
                        <span id="humidity-text" class="text-gray-800 dark:text-gray-100 font-bold text-sm md:text-base">-- %</span>
                    </div>
                </div>

                <!-- 一週預報區塊 -->
                <div class="mt-2">
                    <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-3 border-b border-gray-100 dark:border-gray-800 pb-2 flex items-center gap-2">
                        📅 一週天氣預報
                    </h3>
                    <div id="forecast-list" class="flex flex-col gap-2.5">
                        <!-- 動態產生預報 -->
                    </div>
                </div>

                <div class="mt-4 pt-4 border-t border-gray-100 dark:border-gray-800/50 text-[10px] md:text-xs text-gray-400 dark:text-gray-500 text-center leading-relaxed">
                    資料來源：Open-Meteo<br>預報模型：ECMWF IFS (HRES)
                </div>
            </div>

            <div id="error-state" class="hidden flex-col items-center justify-center py-12 text-center">
                <span class="text-5xl mb-4 drop-shadow-md">⚠️</span>
                <p class="text-gray-800 dark:text-gray-200 font-bold text-lg">資料取得失敗</p>
                <p class="text-gray-500 dark:text-gray-400 text-sm mt-1">請確認您的網路連線狀態。</p>
            </div>
        </div>
    </div>

    <script>
        function getWeatherDescription(code) {
            const mapData = {
                0: { text: "晴朗無雲", icon: "☀️" },
                1: { text: "大致晴朗", icon: "🌤️" },
                2: { text: "部分多雲", icon: "⛅" },
                3: { text: "陰天", icon: "☁️" },
                45: { text: "有霧", icon: "🌫️" },
                48: { text: "結霜霧", icon: "🌫️" },
                51: { text: "輕微毛毛雨", icon: "🌦️" },
                53: { text: "中等毛毛雨", icon: "🌧️" },
                55: { text: "密集毛毛雨", icon: "🌧️" },
                61: { text: "微雨", icon: "🌦️" },
                63: { text: "中雨", icon: "🌧️" },
                65: { text: "大雨", icon: "🌧️" },
                71: { text: "小雪", icon: "🌨️" },
                73: { text: "中雪", icon: "❄️" },
                75: { text: "大雪", icon: "❄️" },
                80: { text: "短暫陣雨", icon: "🌦️" },
                81: { text: "中等陣雨", icon: "🌧️" },
                82: { text: "猛烈陣雨", icon: "⛈️" },
                95: { text: "雷雨", icon: "⛈️" }
            };
            return mapData[code] || { text: "未知天氣", icon: "❓" };
        }

        const uiPanel = document.getElementById('ui-panel');
        const headerTip = document.getElementById('header-tip');
        const stateLoading = document.getElementById('loading-state');
        const stateData = document.getElementById('data-state');
        const stateError = document.getElementById('error-state');

        function showPanel() {
            uiPanel.classList.remove('translate-y-full', 'md:translate-x-full');
            if(headerTip) headerTip.classList.add('opacity-10'); // 滑出時讓頂部提示變得更透明，降低干擾
        }

        function hidePanel() {
            uiPanel.classList.add('translate-y-full', 'md:translate-x-full');
            if(headerTip) headerTip.classList.remove('opacity-10');
        }

        document.getElementById('close-btn').addEventListener('click', hidePanel);
        document.getElementById('close-handle').addEventListener('click', hidePanel);

        document.addEventListener('DOMContentLoaded', () => {
            
            const urlParams = new URLSearchParams(window.location.search);
            let initLat = parseFloat(urlParams.get('lat'));
            let initLng = parseFloat(urlParams.get('lng'));
            let hasParams = true;

            if (isNaN(initLat) || isNaN(initLng)) {
                initLat = 27.9506;
                initLng = -82.4572;
                hasParams = false;
            }

            const initLocation = L.latLng(initLat, initLng).wrap();

            // 關閉 Leaflet 預設的 zoom 控制器
            const map = L.map('map', { zoomControl: false }).setView([initLocation.lat, initLocation.lng], 6);
            
            // 綁定自訂的放大/縮小按鈕
            document.getElementById('btn-zoom-in').addEventListener('click', () => map.zoomIn());
            document.getElementById('btn-zoom-out').addEventListener('click', () => map.zoomOut());

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri',
                maxZoom: 19
            }).addTo(map);

            let currentMarker = null;

            map.on('click', async function(e) {
                const clickLatLng = e.latlng;
                
                const wrappedLatLng = clickLatLng.wrap();
                const lat = wrappedLatLng.lat;
                const lng = wrappedLatLng.lng;

                if (currentMarker) {
                    currentMarker.setLatLng(clickLatLng);
                } else {
                    currentMarker = L.marker(clickLatLng).addTo(map);
                }
                
                document.getElementById('coord-text').innerText = `${Math.abs(lat).toFixed(4)}° ${lat >= 0 ? 'N' : 'S'}, ${Math.abs(lng).toFixed(4)}° ${lng >= 0 ? 'E' : 'W'}`;
                
                stateLoading.classList.remove('hidden'); stateLoading.classList.add('flex');
                stateData.classList.add('hidden'); stateError.classList.add('hidden');
                showPanel();

                try {
                    const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&models=ecmwf_ifs&timezone=auto`;
                    
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error('API 請求失敗');
                    const data = await response.json();

                    if (data.current) {
                        const current = data.current;
                        const weatherInfo = getWeatherDescription(current.weather_code);

                        document.getElementById('temp-text').innerText = Math.round(current.temperature_2m);
                        document.getElementById('condition-text').innerText = weatherInfo.text;
                        document.getElementById('weather-icon').innerText = weatherInfo.icon;
                        document.getElementById('wind-text').innerText = `${current.wind_speed_10m} km/h`;
                        document.getElementById('humidity-text').innerText = `${current.relative_humidity_2m} %`;
                    }

                    if (data.daily) {
                        const forecastList = document.getElementById('forecast-list');
                        forecastList.innerHTML = ''; 
                        const daysOfWeek = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];

                        for (let i = 0; i < data.daily.time.length; i++) {
                            const dateObj = new Date(data.daily.time[i]);
                            const dayName = (i === 0) ? '今天' : daysOfWeek[dateObj.getDay()];
                            const dateStr = `${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
                            
                            const weatherInfo = getWeatherDescription(data.daily.weather_code[i]);
                            const maxTemp = Math.round(data.daily.temperature_2m_max[i]);
                            const minTemp = Math.round(data.daily.temperature_2m_min[i]);
                            const rain = data.daily.precipitation_sum[i];

                            const rainColor = rain > 0 ? "text-blue-500 dark:text-blue-400 font-bold" : "text-gray-400 dark:text-gray-500";

                            const row = document.createElement('div');
                            row.className = "flex items-center justify-between bg-gray-50 dark:bg-gray-800/40 py-2.5 px-4 rounded-2xl border border-gray-100 dark:border-gray-700/30";
                            row.innerHTML = `
                                <div class="flex flex-col w-[30%]">
                                    <span class="text-[13px] md:text-sm font-bold text-gray-800 dark:text-gray-200">${dayName}</span>
                                    <span class="text-[10px] md:text-xs text-gray-500 dark:text-gray-400">${dateStr}</span>
                                </div>
                                <div class="flex items-center justify-center w-[20%] text-xl drop-shadow-sm">
                                    ${weatherInfo.icon}
                                </div>
                                <div class="flex flex-col items-end w-[50%] text-sm">
                                    <span class="text-gray-800 dark:text-gray-200 font-semibold font-mono tracking-tighter">${minTemp}° <span class="text-gray-400 mx-0.5">/</span> ${maxTemp}°</span>
                                    <span class="text-[11px] flex items-center gap-1 ${rainColor} mt-0.5">
                                        💧 ${rain > 0 ? rain.toFixed(1) + ' mm' : '0 mm'}
                                    </span>
                                </div>
                            `;
                            forecastList.appendChild(row);
                        }
                    }

                    stateLoading.classList.remove('flex'); stateLoading.classList.add('hidden');
                    stateData.classList.remove('hidden'); stateData.classList.add('flex');
                    
                } catch (error) {
                    console.error("錯誤:", error);
                    stateLoading.classList.remove('flex'); stateLoading.classList.add('hidden');
                    stateError.classList.remove('hidden'); stateError.classList.add('flex');
                }
            });

            if (hasParams) {
                map.fire('click', { latlng: initLocation });
            }
        });
    </script>
</body>
</html>
