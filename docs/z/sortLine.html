<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多功能逐行文字排序工具 (2026年10月6日 修訂版)</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f1f8f1;
            color: #2e5a2c;
        }
        
        h2 { margin: 10px 0; font-size: 1.1rem; font-weight: 500; color: #4a7c47; padding-left: 10px; }
        .container { display: flex; flex-direction: column; flex: 1; gap: 10px; }
        
        textarea {
            flex: 1;
            width: 100%;
            padding: 20px;
            font-size: 16px;
            border: 1px solid #c8e6c9;
            border-radius: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(100, 150, 100, 0.08);
            resize: none;
            outline: none;
            color: #333;
            line-height: 1.5;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        
        textarea:focus { box-shadow: 0 6px 20px rgba(100, 150, 100, 0.15); border-color: #a5d6a7; }
        
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 5px 0;
        }
        
        button {
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            background-color: #81c784;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(129, 199, 132, 0.4);
            transition: background-color 0.3s, transform 0.1s;
        }
        
        button:hover { background-color: #66bb6a; }
        button:active { transform: scale(0.97); }
        .btn-reverse { background-color: #e57373; box-shadow: 0 4px 12px rgba(229, 115, 115, 0.4); }
        .btn-reverse:hover { background-color: #ef5350; }
    </style>
</head>
<body>
    <div class="container">
        <h2>請貼上文字</h2>
        <textarea id="inputText" placeholder="例如：&#10;(1) 蘋果&#10;[A] Apple&#10;「2」 Banana"></textarea>
        
        <div class="button-group">
            <button onclick="executeSort('standard', false)">一般字典排序 (A→Z)</button>
            <button class="btn-reverse" onclick="executeSort('standard', true)">一般字典倒序 (Z→A)</button>
            <button onclick="executeSort('category', false)">嚴格分類 (數字>英文>中文)</button>
            <button class="btn-reverse" onclick="executeSort('category', true)">嚴格分類倒序 (中文>英文>數字)</button>
        </div>
        
        <h2>排序結果</h2>
        <textarea id="outputText" readonly placeholder="排序後的結果會顯示在這裡..."></textarea>
    </div>

    <script>
        // 強化版分類判斷邏輯
        function getCategory(str) {
            // 使用正規表達式搜尋字串中「第一個」出現的 數字、英文或中文字元 (涵蓋全半形)
            const match = str.match(/[0-9０-９a-zA-Zａ-ｚＡ-Ｚ\u4e00-\u9fa5]/);
            
            // 若整行皆無上述字元（如純標點符號或空行），則回傳類別 4 墊底
            if (!match) return 4;
            
            const firstChar = match[0];
            
            // 判斷該字元的所屬權重
            if (/[0-9０-９]/.test(firstChar)) return 1;
            if (/[a-zA-Zａ-ｚＡ-Ｚ]/.test(firstChar)) return 2;
            if (/[\u4e00-\u9fa5]/.test(firstChar)) return 3;
            
            return 4;
        }

        function executeSort(type, isReverse) {
            const input = document.getElementById('inputText').value;
            let lines = input.split('\n');
            
            if (type === 'standard') {
                lines.sort((a, b) => a.localeCompare(b, 'zh-TW', { numeric: true }));
            } else if (type === 'category') {
                lines.sort((a, b) => {
                    let catA = getCategory(a);
                    let catB = getCategory(b);
                    
                    if (catA !== catB) {
                        return catA - catB; // 依 數字(1) -> 英文(2) -> 中文(3) -> 其他(4) 排序
                    }
                    
                    // 類別相同時，加入 numeric: true 讓自然數字正確排序 (如 2 在 10 之前)
                    return a.localeCompare(b, 'zh-TW', { numeric: true });
                });
            }
            
            if (isReverse) {
                lines.reverse();
            }
            
            document.getElementById('outputText').value = lines.join('\n');
        }
    </script>
    
</body>
</html>
