<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html,
        body {
                color: rgb(120, 120, 120);
                background-color: rgb(1, 1, 1);
        }
    </style>
    <title>myip</title>
</head>
<body onload="upPage0()">
  <h2><label id="ipI">0.0.0.0</label></h2>
  <p><a href="https://app.jwint.net/myip/ipDetail"  target="_blank">detail</a></p>
  
<script defer>
    async function ipAddr() {     
      let txtIP = "";
      try {
        const response = await fetch("https://api.ipify.org/",{cache:"no-cache"});
        if (!response.ok) {
          throw new Error(`Response status: ${response.status}`);
        }
        txtIP = await response.text();
      } catch (error) {
          txtIP = "999.999.999.999";
      }
      return txtIP ;
    }   

    async function upPage0(){
        let ipNow = await ipAddr();
        let labelElement = document.getElementById("ipI");
        labelElement.innerHTML = ipNow;
    }

</script>
</body>
</html>
