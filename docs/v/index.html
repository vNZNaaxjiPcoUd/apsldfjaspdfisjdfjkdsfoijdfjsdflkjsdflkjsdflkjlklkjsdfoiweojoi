<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <base target="_blank">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>景</title>
<style>
body {
    font-family: 'Inter', sans-serif;
    font-size: 16px; 
    color: #ffd700; 
    background-color: #000000; 
    overscroll-behavior-y: none; 
    font-weight: 360;
}

a, a.visited {
    color: inherit;
    text-decoration: none;
}

#inputDialog {
    background-color: #1a1a1a; 
    color: #d3d3d3; 
    border: none; 
    border-radius: 16px; 
    padding: 30px; 
    text-align: center; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    
    position: fixed;
    margin-top: 15dvh; 
    margin-bottom: auto; 
    max-height: 80dvh; 
    overflow-y: auto;
}

#inpTitle {
    margin-top: 0; 
    color: #ffd700; 
    font-size: 20px; 
    font-weight: bold; 
    margin-bottom: 5px;
}

#inputT {
    background: transparent; 
    border: none; 
    border-bottom: 2px solid #ffd700; 
    color: #ffffff; 
    padding: 8px 12px; 
    outline: none; 
    font-size: 20px; 
    text-align: center; 
    width: 90%;
}

.btn-cmd {
    background-color: #ffd700; 
    color: #333333; 
    border: none; 
    border-radius: 10px; 
    padding: 10px 50px; 
    font-weight: bold; 
    cursor: pointer; 
    margin: 10px 1px; 
    box-shadow: 0 2px 0 #ccaa00;
    font-size: 18px; 
}
</style>
</head>
<body>

<div id="showID">
    <div id="uID"></div>
</div>

<dialog id="inputDialog">
    <h2 id="inpTitle">請輸入標題</h2>
    <input type="text" id="inputT" placeholder="輸入內容"><br><br>
    <button id="okCmd" class="btn-cmd">確定</button>
    <button id="pasteCmd" class="btn-cmd">貼上</button>    
    <button id="cancelCmd" class="btn-cmd">取消</button>    
</dialog>


<script  src="vUrlList.js"></script>
<script defer src="vUrl.js"></script>

</body>
</html>
