<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2FA</title>
  <!-- 載入 QR Code 繪製套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --primary: #f6821f; 
      --primary-hover: #e06d0b;
      --text: #1e293b;
      --muted: #64748b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 720px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h2 {
      margin-top: 0;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .card h3 {
      margin-top: 0;
      font-size: 1.05rem;
    }
    .form-group {
      margin-bottom: 0.85rem;
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    button {
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    #qr-container {
      margin-top: 1rem;
      display: none;
      padding: 1rem;
      background: #f1f5f9;
      border-radius: 6px;
      text-align: center;
    }
    #qrcode {
      display: inline-block;
      padding: 0.75rem;
      background: #fff;
      border-radius: 6px;
    }
    .secret-box {
      margin-top: 0.75rem;
      font-family: monospace;
      font-size: 0.95rem;
      background: #fff;
      padding: 0.4rem 0.75rem;
      border-radius: 4px;
      display: inline-block;
      border: 1px dashed var(--muted);
    }
    pre {
      background: #0f172a;
      color: #38bdf8;
      padding: 1rem;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 0.85rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- 步驟 3：日常登入驗證 -->
  <div class="card">
    <h3>2FA 驗證</h3>
    <div class="form-group">
      <label for="workerUrl">網址</label>
      <input type="text" id="workerUrl" value="https://api2fa.jwint.win/" placeholder="" />
    </div>    
    <div class="form-group">
      <label for="userId">使用者 ID</label>
      <input type="text" id="userId" placeholder="..." />
    </div>    
    <div class="form-group">
      <label for="verifyToken">目前驗證碼</label>
      <input type="text" id="verifyToken" maxlength="6" placeholder="123456" />
    </div>
    <button type="button" id="checkBtn" >送出驗證</button>
  </div>

  <!-- API 回應檢視區 -->
  <div class="card">
    <h3>回應結果</h3>
    <pre id="responseLog">等待操作...</pre>
  </div>

  <script src="check2fa.js"></script>
  <script src="index.js"></script>
</body>
</html>
